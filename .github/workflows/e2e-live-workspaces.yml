# Live check of client workspaces, as the platform owner: two labelled TEST businesses, test
# accounts via real invitations, TEST ORDER orders, isolation, subscription lock and renewal.
# Never touches Larose or real clients. Needs the SKYFLY_OWNER_EMAIL and SKYFLY_OWNER_PASSWORD
# repository secrets (added by the owner in GitHub; never printed). Manual only.
name: Live workspaces test
on:
  workflow_dispatch:
    inputs:
      url:
        description: Verified Skyfly service address (https://<name>.onrender.com)
        required: true
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04 # Playwright's Chromium does not support ubuntu-latest (26.04) yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node test/e2e/live-workspaces.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
          SKYFLY_OWNER_EMAIL: ${{ secrets.SKYFLY_OWNER_EMAIL }}
          SKYFLY_OWNER_PASSWORD: ${{ secrets.SKYFLY_OWNER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: live-screenshots/
          retention-days: 7
