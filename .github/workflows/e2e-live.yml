# Places ONE clearly labelled test order through the live Larose page (plus one labelled
# fallback row) and checks Skyfly, the Google Sheet backup, pixel events and a restart. Manual only.
name: Live end-to-end test (Larose -> Skyfly)
on:
  workflow_dispatch:
    inputs:
      url:
        description: Verified Skyfly service address (https://<name>.onrender.com)
        required: true
      landing_url:
        description: Page to test (default the GitHub Pages Larose page; e.g. https://skyfly-gybf.onrender.com/p/larose-skincare/)
        default: ''
      check_reference:
        description: Check-only (places NO order) - an existing test order reference to look up, e.g. LR-MTX9YXT
        default: ''
      restart_check:
        description: Also restart the live service to prove the order survives a restart (brief downtime)
        default: 'no'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04 # Playwright's Chromium does not support ubuntu-latest (26.04) yet
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node test/e2e/live.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RESTART_CHECK: ${{ inputs.restart_check }}
          LANDING_URL: ${{ inputs.landing_url }}
          CHECK_REFERENCE: ${{ inputs.check_reference }}
          SKYFLY_OWNER_EMAIL: ${{ secrets.SKYFLY_OWNER_EMAIL }}
          SKYFLY_OWNER_PASSWORD: ${{ secrets.SKYFLY_OWNER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: live-screenshots/
          retention-days: 7
