# Activates public registration: Cloudflare Turnstile widget, Resend sending domain (+ its DNS records on
# Cloudflare) and the six settings on the Render "skyfly" service, then a redeploy. Skyfly's own launch
# checks open registration only when a real test email and the Turnstile secret both work.
# Dry run unless confirm is exactly "activate signup". Prints no keys.
name: Activate public signup (Resend + Turnstile)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "activate signup" to apply (anything else is a dry run)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Whether the two keys exist (yes / no only; values are never printed). Only these two named secrets
      # are read: a step that serialises ALL secrets (toJSON(secrets)) makes GitHub hold every run for
      # approval ("action_required", no job ever starts), which kept this workflow from running at all.
      - name: Are the two keys saved? (yes / no only)
        env:
          HAS_CF_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_RS_SECRET: ${{ secrets.RESEND_API_KEY != '' }}
          HAS_CF_VAR: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          HAS_RS_VAR: ${{ vars.RESEND_API_KEY != '' }}
        run: |
          check() { if [ "$2" = "true" ]; then echo "OK    secret $1 is set";
            elif [ "$3" = "true" ]; then echo "WARN  $1 was saved as a VARIABLE (plain text to anyone with repo access): used this time; move it to Secrets";
            else echo "MISS  $1: not a repository secret (Settings > Secrets and variables > Actions; the name is exact and case-sensitive)"; fi; }
          check CLOUDFLARE_API_TOKEN "$HAS_CF_SECRET" "$HAS_CF_VAR"
          check RESEND_API_KEY "$HAS_RS_SECRET" "$HAS_RS_VAR"
      - run: node scripts/activate-signup.mjs
        env:
          # A secret is preferred; a key mistakenly saved as a Variable is accepted (with the warning above).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          APPLY: ${{ inputs.confirm == 'activate signup' && '1' || '' }}
