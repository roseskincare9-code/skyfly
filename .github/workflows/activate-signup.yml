# TEMPORARY BRANCH VERSION: lists the NAMES (never values) of the secrets and variables Actions can see.
name: Activate public signup (Resend + Turnstile)
on:
  workflow_dispatch:
    inputs:
      confirm:
        required: false
        default: ''
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Names only
        env:
          S: ${{ toJSON(secrets) }}
          V: ${{ toJSON(vars) }}
        run: |
          echo "SECRETS visible to Actions (names only):"; echo "$S" | jq -r 'keys[]' | sed 's/^/  /'
          echo "VARIABLES visible to Actions (names only):"; echo "$V" | jq -r 'keys[]' | sed 's/^/  /'
          for n in CLOUDFLARE_API_TOKEN RESEND_API_KEY; do
            echo "$S" | jq -e --arg n "$n" 'has($n) and (.[$n] | length > 0)' >/dev/null && echo "FOUND secret $n (non-empty)" || echo "MISSING secret $n"
            echo "$V" | jq -e --arg n "$n" 'has($n)' >/dev/null && echo "NOTE: $n exists as a VARIABLE, not a secret"
          done; true
