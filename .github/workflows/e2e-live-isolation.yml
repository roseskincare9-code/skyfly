# Live business-isolation audit on the deployed service: registers two test businesses (A and B, "(test)",
# @skyfly.invalid) and a staff member of A, gives A one of each record type, then sends every workspace
# route signed out, as B (inside A's workspace and with A's IDs in its own), tampered forms and API
# requests, searches/exports, the Super Admin area and staff restrictions. Uses no secrets and only
# made-up test data (one test order in A, marked test). Manual only.
name: Live isolation audit (two test businesses)
on:
  workflow_dispatch:
    inputs:
      url:
        description: Skyfly address (https://getskyfly.com or https://<name>.onrender.com)
        required: true
        default: https://getskyfly.com
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Registration and sign-in protection (Terms pages, closed registration, per-email limits; creates nothing)
        run: node test/e2e/live-abuse.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
      - name: Resend key from the service settings (masked; only to read the test inbox)
        if: always()
        run: node scripts/resend-key-env.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - name: Three-business isolation audit (A, B, C)
        if: always()
        # Test businesses are created by the Super Admin test account (secrets SKYFLY_ADMIN_EMAIL and
        # SKYFLY_ADMIN_PASSWORD) with owner invitations, so the public bot check is never bypassed.
        # Without those secrets it uses public registration, which only works while no bot check is required.
        run: |
          if [ -n "$SKYFLY_ADMIN_EMAIL" ] || curl -fsS -o /dev/null "${{ inputs.url }}/signup"; then node test/e2e/live-isolation.e2e.js; else echo "::warning::Not run: add the SKYFLY_ADMIN_EMAIL and SKYFLY_ADMIN_PASSWORD secrets (a Super Admin test account), or open registration. Last full run: 41318450903."; fi
        env:
          SKYFLY_URL: ${{ inputs.url }}
          SKYFLY_ADMIN_EMAIL: ${{ secrets.SKYFLY_ADMIN_EMAIL }}
          SKYFLY_ADMIN_PASSWORD: ${{ secrets.SKYFLY_ADMIN_PASSWORD }}
