# One-off diagnostic: shows SheetDB's exact answers for (1) one labelled TEST ORDER row
# posted to the first tab and (2) adding a "Skyfly Orders" tab with Skyfly's columns.
# Prints status codes and SheetDB's messages only.
name: Diagnose Google Sheet writes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SheetDB write answers
        run: |
          S=https://sheetdb.io/api/v1/m111fq96ve953
          echo "POST row (first tab) -> $(curl -s -o /tmp/a -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{"fullName":"TEST ORDER diagnostic please ignore","source":"Skyfly diagnostic | TEST ORDER"}}' "$S") $(head -c 300 /tmp/a)"
          echo "POST /sheet (add Skyfly Orders tab) -> $(curl -s -o /tmp/b -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"Skyfly Orders","first_row":["timestamp","fullName","address","phone","email","package","source","state","quantity","notes","skyflyId","total"]}' "$S/sheet") $(head -c 300 /tmp/b)"
          echo "GET /keys?sheet=Skyfly%20Orders -> $(curl -s -o /tmp/c -w '%{http_code}' "$S/keys?sheet=Skyfly%20Orders") $(head -c 300 /tmp/c)"
