# TEMPORARY: live check of Skyfly's own Meta pixel on the demo page. Removed after the check.
name: Skyfly pixel live check
on:
  workflow_dispatch:
    inputs:
      test_event_code:
        description: Meta test event code to store in Render (empty = do not change)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/skyfly-pixel-live.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TEST_EVENT_CODE: ${{ inputs.test_event_code }}
