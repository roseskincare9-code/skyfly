# TEMPORARY (owner-approved 2026-10-18): direct pg_dump backup of the live database, with access
# opened to this runner's IP only and closed again (also on failure). Restore-checked, encrypted.
name: Database backup (direct, temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/db-backup-direct.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - name: Close database access (always)
        if: always()
        run: node scripts/db-backup-direct.mjs --revert
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: skyfly-db-backup-encrypted
          path: |
            skyfly-db.dump.enc
            RESTORE.txt
          retention-days: 90
