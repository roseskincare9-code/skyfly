# Runs the automated test suite against a throwaway PostgreSQL on every push.
name: Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skyfly
          POSTGRES_PASSWORD: skyfly
          POSTGRES_DB: skyfly_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "DATABASE_URL=postgres://skyfly:skyfly@localhost:5432/skyfly_test" > .env.test
      - run: npm test
