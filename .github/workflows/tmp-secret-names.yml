# Temporary: lists the NAMES (never values) of the secrets and variables GitHub Actions can see.
name: Secret names check (temporary)
on:
  push:
    branches: [tmp-secret-names]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Names only
        env:
          S: ${{ toJSON(secrets) }}
          V: ${{ toJSON(vars) }}
        run: |
          echo "Repository/organisation secrets visible to Actions (names only):"; echo "$S" | jq -r 'keys[]' | sed 's/^/  /'
          echo "Variables visible to Actions (names only):"; echo "$V" | jq -r 'keys[]' | sed 's/^/  /'
          for n in CLOUDFLARE_API_TOKEN RESEND_API_KEY; do
            echo "$S" | jq -e --arg n "$n" 'has($n) and (.[$n] | length > 0)' >/dev/null && echo "FOUND secret $n (non-empty)" || echo "MISSING secret $n"
            echo "$V" | jq -e --arg n "$n" 'has($n)' >/dev/null && echo "NOTE: $n exists as a VARIABLE, not a secret"
          done; true
