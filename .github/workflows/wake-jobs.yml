# Free Render services sleep after ~15 idle minutes: the next visitor then waits for a cold
# start (often 30+ seconds) and background jobs (email follow-ups, Google Sheet copies,
# subscription expiry) pause. This calls /healthz every 10 minutes so the service stays awake
# (one service running all month is ~744 h, inside the 750 free instance hours), and once an
# hour also checks that the background jobs ran. Read-only; creates no data. Free for public repos.
name: Wake background jobs
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep Skyfly awake; hourly, report background job runs
        run: |
          U=https://skyfly-gybf.onrender.com/healthz
          curl -s -m 90 -o /dev/null -w 'wake: HTTP %{http_code} in %{time_total}s\n' "$U" || true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%M)" -ge 10 ]; then exit 0; fi
          sleep 75
          curl -s -m 30 "$U" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const h=JSON.parse(d);console.log(JSON.stringify(h,null,1));const w=h.workers||{};const ok=(j)=>j&&j.lastOkAt&&Date.now()-Date.parse(j.lastOkAt)<5*60000;if(!ok(w.email)||!ok(w.sheets)){console.log('A background job has not completed a run in the last 5 minutes');process.exit(1)}})"
