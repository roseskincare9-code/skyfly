# Read-only: checks where the Larose landing page is actually published (GitHub Pages).
name: Probe landing page addresses
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP status of candidate addresses
        run: |
          for u in https://roseskincare9-code.github.io/Larosenigeria/ https://roseskincare9-code.github.io/larosenigeria/ \
                   https://roseskincare9-code.github.io/Larosenigeria/index.html https://roseskincare9-code.github.io/ \
                   https://roseskincare9-code.github.io/Larose-Skincare-/ https://roseskincare9-code.github.io/Scaleforge-nigeria/ \
                   https://roseskincare9-code.github.io/Scaleforgelondon/ https://roseskincare9-code.github.io/AI-ACADEMY/; do
            echo "$(curl -s -o /tmp/body -w '%{http_code}' -L "$u") $u  title: $(grep -o '<title>[^<]*' /tmp/body | head -1 | cut -c8-90)  skyfly: $(grep -o 'skyfly-gybf[^"]*' /tmp/body | head -1)"
          done
      - name: Larose page version and Skyfly-hosted copies
        run: |
          curl -s -L https://roseskincare9-code.github.io/Larosenigeria/ -o /tmp/larose
          echo "GitHub Pages Larose page: thank-you 'We have received your order': $(grep -c 'We have received your order' /tmp/larose), WhatsApp button skyWa: $(grep -c 'id=\"skyWa\"' /tmp/larose), upsell box skyUp: $(grep -c 'id=\"skyUp\"' /tmp/larose), Skyfly API: $(grep -o 'SKYFLY_API=\"[^\"]*' /tmp/larose | head -1)"
          for u in https://skyfly-gybf.onrender.com/p/larosenigeria/ https://skyfly-gybf.onrender.com/p/skyfly-demo/; do
            echo "$(curl -s -o /tmp/b -w '%{http_code}' --max-time 90 "$u") $u  title: $(grep -o '<title>[^<]*' /tmp/b | head -1 | cut -c8-90)"
          done
          echo "Larose catalog (public): $(curl -s --max-time 60 https://skyfly-gybf.onrender.com/api/public/pages/larosenigeria/catalog | head -c 400)"
      - name: GitHub Pages settings (public API)
        run: |
          for r in Larosenigeria Larose-Skincare- Scaleforge-nigeria Scaleforgelondon AI-ACADEMY; do
            echo "== $r"; curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/roseskincare9-code/$r/pages | head -c 600; echo
            curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/roseskincare9-code/$r/pages/builds/latest" | grep -E '"status"|"created_at"|"message"' | head -4
          done
        env:
          GH_TOKEN: ${{ github.token }}
