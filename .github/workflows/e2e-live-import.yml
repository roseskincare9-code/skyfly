# Live check of landing-page import → publish → native checkout → dashboard, and of business owners'
# sign-in and isolation (owner A, owner B, switching, invitation), on the deployed service.
# The dashboard part signs in as the restricted live-test account (test businesses only): this run
# picks a new random password, gives the server only its hash (Render setting, redeploy), and clears
# it at the end. No one's own password is used. Places a few clearly labelled TEST ORDERs in the
# test businesses only. Manual only.
name: Live import test (import test site + dashboard)
on:
  workflow_dispatch:
    inputs:
      url:
        description: Verified Skyfly service address (https://<name>.onrender.com)
        required: true
      suite:
        description: Which checks to run (the live-test sign-in lasts 20 minutes)
        type: choice
        default: all
        options: [all, tracking]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04 # Playwright's Chromium does not support ubuntu-latest (26.04) yet
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Sign-in for the live-test account (new password; hash on the server; redeploy)
        run: node scripts/e2e-login.mjs enable
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - name: Import → publish → order → dashboard (import test business)
        if: inputs.suite == 'all'
        run: node test/e2e/live-import.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
      - name: Hosting, add-on and owner import/edit/republish/unpublish (demo shop)
        if: always() && inputs.suite == 'all'
        run: node test/e2e/live-hosting.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
      - name: Business owners' sign-in, isolation, switching, invitation, phone (test businesses only)
        if: always() && inputs.suite == 'all'
        run: node test/e2e/live-tenancy.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
      - name: Tracking & Pixels — add, load, switch off and remove Meta, TikTok and X IDs (import test business)
        if: always()
        run: node test/e2e/live-tracking.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
      - name: Abandoned checkouts on the demo shop (in progress → abandoned → resumed → recovered; about 12 minutes)
        if: always() && inputs.suite == 'all'
        run: node test/e2e/live-abandoned.e2e.js
        env:
          SKYFLY_URL: ${{ inputs.url }}
      - name: Disable the live-test sign-in again
        if: always()
        run: node scripts/e2e-login.mjs disable
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-import-screenshots
          path: live-screenshots/
          retention-days: 7
