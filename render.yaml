# Render Blueprint for Skyfly. NOT applied yet - nothing is deployed until the
# owner reviews plans/costs and creates the Blueprint in Render manually.
# These resources belong to Skyfly only; do not point them at any other project.
services:
  - type: web
    name: skyfly
    runtime: node
    plan: starter            # review before applying (paid plan)
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: skyfly-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_SIGNUP
        value: "false"     # set to "true" only while creating the owner account

databases:
  - name: skyfly-db
    databaseName: skyfly
    plan: basic-256mb      # review before applying (paid plan, persistent with backups)
