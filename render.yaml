# Render Blueprint for Skyfly. NOT applied yet: nothing is deployed until the
# owner reviews plans/costs and creates the Blueprint in Render manually.
# These resources belong to Skyfly only; never point them at another project.
services:
  - type: web
    name: skyfly
    runtime: node
    region: frankfurt         # closest Render region to Nigeria
    plan: starter             # paid; "free" sleeps when idle (slow first visit/order). Review before applying.
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: skyfly-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"        # internal Render connection; "true" for Supabase or external URLs
      - key: SESSION_SECRET
        generateValue: true
      - key: SKYFLY_ENCRYPTION_KEY
        generateValue: true   # encrypts pixel access tokens; must be 32 bytes base64. Never change after saving tokens.
      # PUBLIC_BASE_URL is not needed at first: Skyfly uses the service's own onrender.com
      # address. Add PUBLIC_BASE_URL (dashboard custom domain) and PAGES_BASE_URL (pages
      # domain, different host) in the Render dashboard later, when you have a domain.
      - key: ALLOWED_ORIGINS
        value: https://roseskincare9-code.github.io
      - key: ALLOW_SIGNUP
        value: first          # only the first account can be created (the owner); set "false" afterwards

databases:
  - name: skyfly-db
    databaseName: skyfly
    region: frankfurt
    plan: basic-256mb         # paid, persistent with backups. Free Postgres expires. Review before applying.
