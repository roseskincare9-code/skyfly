# Render Blueprint for Skyfly. NOT applied yet - nothing is deployed until the
# owner reviews plans/costs and creates the Blueprint in Render manually.
# These resources belong to Skyfly only; do not point them at any other project.
services:
  - type: web
    name: skyfly
    runtime: node
    region: frankfurt         # closest Render region to Nigeria
    plan: starter             # paid; "free" sleeps when idle (slow first order). Review before applying.
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: skyfly-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"        # internal Render connection; set "true" for Supabase or external URLs
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false           # e.g. https://skyfly.onrender.com - set in the dashboard
      - key: ALLOWED_ORIGINS
        value: https://roseskincare9-code.github.io
      - key: ALLOW_SIGNUP
        value: "true"         # set to "false" right after creating the owner account

databases:
  - name: skyfly-db
    databaseName: skyfly
    region: frankfurt
    plan: basic-256mb         # paid, persistent with backups. Free Postgres expires. Review before applying.
